# Auto-merge, vendor-recommended ruleset setup: Mergify is a ruleset bypass actor with
# bypass_mode exempt (docs.mergify.com/merge-queue/github-rulesets:
#   "Choose exempt unless you have a reason not to.")
# The review requirement is stated ONCE, in the GitHub ruleset. Nothing here restates it,
# because docs.mergify.com/workflow/actions/merge says:
#   "Mergify automatically reads your GitHub branch protections and rulesets and injects
#    them as merge conditions."
#   "Mergify always respects the branch protection settings"
merge_protections_settings:
  auto_merge_conditions: true
merge_protections:
  - name: green-ci
    description: applies to every pull request
    if: true
    success_conditions:
      - check-success = ci
